name: Deploy Dash App to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # 1️⃣ Checkout full repository
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # required to push to HF Space

      # -------------------------------
      # 2️⃣ Set up Python
      # -------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11  # or your app's version

      # -------------------------------
      # 3️⃣ Install dependencies
      # -------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------
      # 4️⃣ Push to Hugging Face Space
      # -------------------------------
      - name: Deploy to Hugging Face Space
        env:
          HF_USERNAME: zrentala                # your HF username
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # HF token with write access
        run: |
          # Configure git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Add HF remote with username:token for authentication
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/zrentala/ConnectivityVisualizer.git

          # Fetch HF remote and switch to main branch
          git fetch hf
          git checkout main || git checkout -b main

          # Add changes, commit, and force push
          git add .
          git commit -m "Update from GitHub Actions" || echo "No changes to commit"
          git push hf main --force
