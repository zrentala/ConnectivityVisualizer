name: Sync to Hugging Face

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # ✅ correct spelling

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11  # or your desired Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # Your Hugging Face token
        run: |
          git remote add hf https://huggingface.co/spaces/zrentala/ConnectivityVisualizer.git
          git fetch hf
          git checkout -b main || git checkout main
          git add .
          git commit -m "Update from GitHub Actions" || echo "No changes to commit"
          git push hf main --force
